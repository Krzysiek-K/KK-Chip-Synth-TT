# Tiny Tapeout project information
project:
  title:        "KK ChipSynth"      # Project title
  author:       "KK/Altair"      # Your name
  discord:      "kkaltair"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Tiny Tapeout 8-bit style custom chip synthesizer"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_KK_ChipSynth"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "synth_divider.v"
    - "synth_channel.v"
    - "synth_mixer.v"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "reg_data[0]"
  ui[1]: "reg_data[1]"
  ui[2]: "reg_data[2]"
  ui[3]: "reg_data[3]"
  ui[4]: "reg_data[4]"
  ui[5]: "reg_data[5]"
  ui[6]: "reg_data[6]"
  ui[7]: "reg_data[7]"

  # Outputs
  uo[0]: "channel_select[0]"
  uo[1]: "channel_select[1]"
  uo[2]: "GCTRL/reset_release"
  uo[3]: "channel_out[0]"
  uo[4]: "channel_out[1]"
  uo[5]: "channel_out[2]"
  uo[6]: "channel_out[3]"
  uo[7]: "audio_out"

  # Bidirectional pins
  uio[0]: "reg_addr[0]"
  uio[1]: "reg_addr[1]"
  uio[2]: "reg_addr[2]"
  uio[3]: "reg_addr[3]"
  uio[4]: "reg_addr[4]"
  uio[5]: "reg_addr[5]"
  uio[6]: "/WR"
  uio[7]: "/CS"

# Do not change!
yaml_version: 6
